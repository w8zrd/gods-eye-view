# Deploy God's Eye View to GitHub Pages.
#
# SETUP (one time):
#   1. Save this file in your fork at: .github/workflows/deploy-pages.yml
#   2. Commit + push to main.
#   3. On GitHub: Settings -> Pages -> Source -> "GitHub Actions".
#   4. The repo must be PUBLIC for the site to be visible (free plan).
#
# After that, every push to main rebuilds and redeploys automatically.
# Your live URL will be: https://<your-username>.github.io/<repo-name>/
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Project Pages serve from /<repo-name>/, so the build needs that base.
      # Reading it from the repo name keeps this working on any fork.
      - run: npx vite build --base=/${{ github.event.repository.name }}/

      - name: Fix asset layout for Pages
        run: |
          REPO="${{ github.event.repository.name }}"
          # vite-plugin-cesium nests its output under the base path
          # (dist/<repo>/cesium); Pages needs it at dist/cesium so the
          # /<repo>/cesium/... URLs in index.html resolve.
          if [ -d "dist/$REPO/cesium" ]; then
            mv "dist/$REPO/cesium" dist/cesium
            rmdir "dist/$REPO"
          fi
          # Vite rewrites src=/href= with the base but not data-* attributes.
          sed -i "s|data-logo-src=\"/logo.svg\"|data-logo-src=\"/$REPO/logo.svg\"|g" dist/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
